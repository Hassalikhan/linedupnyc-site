name: Update LinedUp Data

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Set timezone to NYC
        run: echo "TZ=America/New_York" >> $GITHUB_ENV

      - name: Run backend script
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python linedup_backend.py

- name: Commit and push if changed
        run: |
          git config user.name "LinedUp Bot"
          git config user.email "bot@linedupnyc.com"
          git stash
          git pull --rebase
          git stash pop || true
          git add linedup_data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update venue data $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
